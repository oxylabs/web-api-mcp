[project]
name = "oxylabs-web-api-mcp"
version = "0.2.0"
description = "Self-hostable MCP server for the Oxylabs Web API (/v1/search, /v1/scrape)"
requires-python = ">=3.10"
dependencies = [
    # Imported directly, and no longer brought in by FastMCP 4, which moved to httpx2.
    # 0.28.1 is the oldest FastMCP 3.4 accepts.
    "httpx>=0.28.1,<1",
    # 3.4.3 is the first FastMCP whose HTTP transport takes the host and origin allowlists
    # server.main() passes (tests/test_server.py checks). Capped below the next major:
    # FastMCP majors have changed APIs this server uses.
    "fastmcp>=3.4.3,<5",
    # app.py imports mcp.types.ToolAnnotations, the type FastMCP's decorators take.
    # FastMCP 3.4 runs on mcp 1.x and 4.x on mcp 2.x; client.py reads the client's name
    # under either field spelling.
    "mcp>=1.24,<3",
]

[project.scripts]
oxylabs-web-api-mcp = "oxylabs_web_api_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oxylabs_web_api_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
