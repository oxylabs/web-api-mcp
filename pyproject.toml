[project]
name = "oxylabs-web-api-mcp"
version = "0.1.0"
description = "Self-hostable MCP server for the Oxylabs Web API (/v1/search, /v1/scrape)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastmcp>=3.4",
    # server.py imports mcp.types.ToolAnnotations, which is the type FastMCP's own
    # decorators are annotated with. No upper bound here on purpose: fastmcp already
    # caps it at <2.0, so this declares the import without adding a second ceiling.
    "mcp>=1.24",
]

[project.scripts]
oxylabs-web-api-mcp = "oxylabs_web_api_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oxylabs_web_api_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
