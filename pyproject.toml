[project]
name = "oxylabs-web-api-mcp"
version = "0.1.0"
description = "Self-hostable MCP server for the Oxylabs Web API (/v1/search, /v1/scrape)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.scripts]
oxylabs-web-api-mcp = "oxylabs_web_api_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oxylabs_web_api_mcp"]
